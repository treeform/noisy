name: Github Actions
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        nim: ['2.2.14', '2.4.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: treeform/setup-nim-action@v6
        with:
          nim-version: ${{ matrix.nim }}
      - name: Install dependencies
        shell: bash
        run: |
          cd ..
          nimby create
          nimby install "${{ github.event.repository.name }}/noisy.nimble"
      - name: Run tests
        run: nim r tests/tests.nim
      - name: Run release tests
        run: nim r -d:release tests/tests.nim
      - name: Run release tests with SIMD fallbacks
        run: nim r -d:release -d:noisyNoAvx -d:noisyNoNeon tests/tests.nim
      - name: Fetch pinned reference sources
        run: nim r tools/gen_references.nim --cache-dir "${{ runner.temp }}/noisy-references"
      - name: Compare against C and C++ references
        run: nim r -f "-d:noisyReferenceDir=${{ runner.temp }}/noisy-references" tests/test_reference.nim
      - name: Run full suite and references with C++ release build
        run: nim cpp -r -f -d:release "-d:noisyReferenceDir=${{ runner.temp }}/noisy-references" tests/tests.nim
