name: Github Actions
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: treeform/setup-nim-action@v6
      - name: Install dependencies
        shell: bash
        run: |
          cd ..
          nimby create
          nimby install "${{ github.event.repository.name }}/noisy.nimble"
      - name: Run tests
        if: runner.os != 'macOS'
        run: nim r tests/tests.nim
      - name: Run SSE2 tests on macOS
        if: runner.os == 'macOS'
        # The ARM64 runner includes Rosetta for x86 SSE2 executables.
        run: >-
          nim r --cpu:amd64 --passC:"-arch x86_64" --passL:"-arch x86_64"
          tests/tests.nim
